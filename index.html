<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✏️ EDIT: search-engine text. Your name and details live in content.js -->

  <meta name="description" content="Helia Amini — electrical engineering and human-centred design. Eindhoven University of Technology." />
  <meta name="author" content="Helia Amini" />
  <meta property="og:title" content="Helia Amini" />
  <meta property="og:description" content="Electrical engineering and human-centred design." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://heliaamini.com" />
  <meta name="theme-color" content="#ffffff" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2306070a'/%3E%3Ctext x='32' y='42' font-family='Helvetica,Arial,sans-serif' font-size='26' font-weight='300' fill='white' text-anchor='middle'%3EHA%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <script>
    (function () {
      var t = localStorage.getItem('portfolio-theme');
      if (!t) t = 'light';  // white body is the intended look; visitors can switch
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<a class="skip-link" href="#work">Skip to work</a>

<!-- ══════════════ NAV ══════════════ -->
<header class="nav on-dark" id="nav">
  <div class="shell nav-inner">
    <a href="#top" class="wordmark" id="wordmark" aria-label="Back to top"></a>
    <nav class="nav-menu" id="navMenu" aria-label="Main">
      <a class="nav-link" href="#about">About</a>
      <a class="nav-link" href="#work">Work</a>
      <a class="nav-link" href="#skills">Skills</a>
      <a class="nav-link" href="#contact">Contact</a>
      <a class="nav-link nav-cv" id="navResume" download>Résumé</a>
    </nav>
    <div class="nav-tools">
      <button class="icon-btn" id="themeToggle" aria-label="Switch between light and dark">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13.2A8.6 8.6 0 1 1 10.8 3.2a6.7 6.7 0 0 0 10 10z"/></svg>
      </button>
      <button class="icon-btn burger" id="burger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="top">

  <!-- ══════════════ OPENER ══════════════ -->
  <section class="opener" id="opener">

    <!-- DEPTH, in four layers. This is what stops it reading as
         "black background": light, colour, circuitry, then grain. -->
    <div class="atmos" aria-hidden="true">
      <span class="glow glow-a"></span>
      <span class="glow glow-b"></span>
      <span class="glow glow-c"></span>
      <svg class="circuit" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" focusable="false">
        <g class="traces" fill="none" stroke-linecap="square">
          <path id="t1" d="M-40,148 H286 L366,228 H680"  pathLength="1000"/>
          <path id="t2" d="M1480,112 H1186 L1106,192 H852" pathLength="1000"/>
          <path id="t3" d="M-40,706 H196 L276,626 H556 L636,706 H930" pathLength="1000"/>
          <path id="t4" d="M1480,768 H1250 L1170,688 H942" pathLength="1000"/>
          <path id="t5" d="M742,-40 V122 L822,202 V368"  pathLength="1000"/>
          <path id="t6" d="M398,940 V806 L478,726 V566"  pathLength="1000"/>
          <path id="t7" d="M-40,428 H128 L208,348 H408"  pathLength="1000"/>
          <path id="t8" d="M1480,448 H1300 L1220,528 H1010" pathLength="1000"/>
          <path id="t9" d="M1480,308 H1372 L1292,228 H1120" pathLength="1000"/>
          <path id="t10" d="M-40,556 H92 L172,636 H330"  pathLength="1000"/>
        </g>
        <g class="pulses" fill="none" stroke-linecap="round">
          <use href="#t1" class="pulse p1"/><use href="#t3" class="pulse p2"/>
          <use href="#t5" class="pulse p3"/><use href="#t8" class="pulse p4"/>
          <use href="#t2" class="pulse p5"/><use href="#t10" class="pulse p6"/>
        </g>
        <g class="vias">
          <circle cx="366" cy="228" r="2.6"/><circle cx="1106" cy="192" r="2.6"/>
          <circle cx="636" cy="706" r="2.6"/><circle cx="822" cy="202" r="2.6"/>
          <circle cx="208" cy="348" r="2.6"/><circle cx="1220" cy="528" r="2.6"/>
          <circle cx="1292" cy="228" r="2.6"/><circle cx="172" cy="636" r="2.6"/>
        </g>
      </svg>
      <span class="vignette"></span>
      <span class="grain"></span>
    </div>

    <span class="edge-index" id="openerIndex" aria-hidden="true"></span>

    <div class="shell opener-grid">
      <p class="opener-line" id="openerLine"></p>
      <div class="opener-foot">
        <div class="hairline"></div>
        <h1 class="display" id="openerName"></h1>
        <dl class="opener-meta" id="openerMeta"></dl>
      </div>
      <a class="scroll-cue" href="#statement" aria-label="Scroll down">
        <span class="cue-word">Scroll</span>
        <span class="cue-rail"><span class="cue-pulse"></span></span>
      </a>
    </div>

  </section>

  <!-- ══════════════ ABOUT — first thing after the cover ══════════════ -->
  <section class="chapter-section about" id="about">
    <div class="shell">
      <p class="lead reveal" id="aboutLead"></p>
      <div class="about-layout">
        <figure class="portrait reveal" id="portrait"></figure>
        <div class="about-copy reveal" id="aboutText"></div>
      </div>
    </div>
  </section>

  <!-- ══════════════ WORK — the gallery ══════════════ -->
  <section class="chapter-section work" id="work">
    <div class="shell">
      <header class="chapter reveal">
        <h2 class="chapter-title">Work</h2>
        <span class="chapter-note" id="workCount"></span>
      </header>
      <div class="filters reveal" id="filters" role="group" aria-label="Filter projects"></div>
      <div class="gallery" id="gallery"></div>
      <p class="empty-note" id="emptyNote" hidden>Nothing under this filter.</p>
    </div>
  </section>

  <!-- ══════════════ SKILLS + CREDENTIALS ══════════════ -->
  <section class="chapter-section skills" id="skills">
    <div class="shell">
      <header class="chapter reveal">
        <h2 class="chapter-title">Skills</h2>
      </header>
      <div class="caps" id="caps"></div>

      <header class="chapter reveal">
        <h2 class="chapter-title">Education &amp; Experience</h2>
      </header>
      <div class="creds" id="credentials"></div>
    </div>
  </section>

  <!-- ══════════════ CONTACT ══════════════ -->
  <section class="contact" id="contact">
    <div class="atmos" aria-hidden="true">
      <span class="glow glow-d"></span>
      <span class="vignette"></span>
      <span class="grain"></span>
    </div>
    <div class="shell contact-grid">
      <header class="chapter chapter-dark reveal">
        <span class="chapter-num">04</span>
        <h2 class="chapter-title">Contact</h2>
      </header>
      <p class="contact-line reveal" id="contactLine"></p>
      <a class="contact-mail reveal" id="contactMail"></a>
      <p class="contact-note reveal" id="contactNote"></p>
      <div class="contact-foot reveal">
        <div class="socials" id="socials"></div>
        <a class="ghost-link" id="contactResume" download>Résumé
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v13M6 12l6 6 6-6"/></svg>
        </a>
      </div>
      <p class="colophon" id="colophon"></p>
    </div>
  </section>

</main>

<!-- ══════════════ PROJECT DIALOG ══════════════ -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="document">
    <button class="modal-close" id="modalClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-scroll" id="modalBody"></div>
  </div>
</div>

  <div class="shell noscript">

  </div>
</noscript>

<script src="content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
